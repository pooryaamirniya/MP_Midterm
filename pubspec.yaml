name: soundify
description: "Soundify — Persian music streaming, secure accounts and background audio."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  local_auth: ^3.0.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

# Compatible with the generated JNI bindings in the Android plugins.
dependency_overrides:
  jni: 1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
